name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      update_latest:
        description: "Update latest release"
        required: true
        default: true
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            archive_arch: x86_64
          - platform: linux/arm64
            archive_arch: aarch64
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          platforms: ${{ matrix.platform }}
          tags: linguaspark-builder:${{ matrix.archive_arch }}

      - name: Extract compiled libraries from Docker container
        run: |
          mkdir -p artifacts
          docker create --name temp-container linguaspark-builder:${{ matrix.archive_arch }}
          docker cp temp-container:/build/liblinguaspark.so ./artifacts/
          if [[ "${{ matrix.platform }}" == "linux/amd64" ]]; then
            docker cp temp-container:/build/libiomp5.so ./artifacts/
          fi
          docker rm temp-container

          cd artifacts
          tar -czvf linguaspark-${{ matrix.archive_arch }}-linux.tar.gz ./*.so
          rm ./*.so
          cd ..

      - name: Upload compiled libraries
        uses: actions/upload-artifact@v4
        with:
          name: linguaspark-${{ matrix.archive_arch }}-linux
          path: artifacts/*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download compiled libraries
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Get version information
        id: get_version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.update_latest }}" == "true" ]]; then
            LATEST_TAG=$(git describe --tags --abbrev=0)
            echo "VERSION=${LATEST_TAG#v}" >> $GITHUB_OUTPUT
            echo "TAG_NAME=latest" >> $GITHUB_OUTPUT
            echo "IS_LATEST=true" >> $GITHUB_OUTPUT
          else
            VERSION=${GITHUB_REF#refs/tags/v}
            echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
            echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
            echo "IS_LATEST=false" >> $GITHUB_OUTPUT
          fi

      - name: Create or update GitHub Release
        uses: ncipollo/release-action@v1
        with:
          name: Release ${{ steps.get_version.outputs.VERSION }}
          tag: ${{ steps.get_version.outputs.IS_LATEST == 'true' && 'latest' || github.ref_name }}
          allowUpdates: true
          artifacts: "artifacts/*.tar.gz"
